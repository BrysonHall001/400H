name: Daily price capture

on:
  schedule:
    - cron: "23 11 * * *"   # ~7:23am ET (6:23 in winter); GitHub may run it minutes late
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scrape per-plan prices (primary record)
        run: python scripts/scrape_plans.py

      - name: Fetch per-unit SightMap feed (if configured)
        env:
          SIGHTMAP_URL: ${{ vars.SIGHTMAP_URL || secrets.SIGHTMAP_URL }}
        run: |
          if [ -n "$SIGHTMAP_URL" ]; then echo "SIGHTMAP_URL configured: yes"; else echo "SIGHTMAP_URL configured: NO - unit fetch will skip"; fi
          python scripts/fetch_units.py

      - name: Commit updated history
        run: |
          git config user.name "400h-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ debug/ || true
          git diff --cached --quiet && echo "No changes today." && exit 0
          git commit -m "Price capture $(date -u +%F)"
          git push
