name: Fetch surrounding context

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenStreetMap context
        run: python scripts/fetch_context.py
      - name: Commit
        run: |
          git config user.name "400h-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/context.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Surrounding context from OpenStreetMap"
          git push
